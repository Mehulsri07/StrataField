name: CI

# Fast checks on every pull request (about 2-3 minutes). The slow part, building the optimised
# installer and testing it on a clean machine, runs after merging to main, and on pull requests
# only when they touch something that can break installing or starting the app.
# Changes to documentation alone skip CI. The Release workflow always builds and tests the installer.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, tests, frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build frontend
        run: npm run build -w app

  audit:
    name: Known vulnerabilities in libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Libraries that go into the app (not build tools); fails on high or critical advisories.
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit

  rust:
    name: Rust format, lint, tests
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          # One cache shared by all branches, refreshed from main.
          shared-key: rust-checks
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # tauri::generate_context! needs the frontend folder to exist. The real frontend is built and
      # checked in the other job, so a placeholder page is enough here (saves installing Node).
      - name: Placeholder frontend
        run: |
          New-Item -ItemType Directory -Force app/dist | Out-Null
          Set-Content app/dist/index.html '<!doctype html><title>StrataField</title>'

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests (database, migrations, backups, old-data import)
        run: cargo test --workspace

  e2e:
    name: End-to-end test (real app, made-up data)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: rust-e2e
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: npm ci

      - name: Build the app (debug, no installer, with the test's stand-ins for file dialogs)
        env:
          VITE_E2E: '1'
        run: npm run tauri -w app -- build --debug --no-bundle

      # Drives every screen of the real app on a scratch data folder, including saving through
      # the real Windows Save dialog (safe here: nobody is using the runner's desktop).
      - name: End-to-end test
        env:
          E2E_REAL_DIALOGS: '1'
        run: npm run e2e

  # Decides whether a pull request needs the installer build and clean-machine test.
  changes:
    name: Does this change packaging or start-up?
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      installer: ${{ steps.filter.outputs.installer }}
      update: ${{ steps.filter.outputs.update }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            installer:
              - 'app/src-tauri/tauri.conf.json'
              - 'app/src-tauri/capabilities/**'
              - 'app/src-tauri/icons/**'
              - 'app/src-tauri/Cargo.toml'
              - 'app/src-tauri/build.rs'
              - 'app/src-tauri/src/lib.rs'
              - 'app/src-tauri/src/main.rs'
              - 'app/src-tauri/src/state.rs'
              - 'core/db/src/db.rs'
              - 'core/db/src/schema.rs'
              - 'core/db/src/legacy.rs'
              - 'core/db/Cargo.toml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'package.json'
              - 'package-lock.json'
              - 'app/package.json'
              - '.github/**'
            update:
              - 'app/src/lib/updates.ts'
              - 'app/src/components/app/UpdateNotice.tsx'
              - 'app/src/pages/Settings.tsx'
              - 'app/src-tauri/tauri.conf.json'
              - 'app/src-tauri/tauri.release.conf.json'
              - 'app/src-tauri/capabilities/**'
              - 'app/src-tauri/Cargo.toml'
              - 'app/src-tauri/src/lib.rs'
              - 'app/src-tauri/windows/**'
              - 'Cargo.lock'
              - 'app/package.json'
              - 'package-lock.json'
              - 'e2e/update-test.mjs'
              - 'e2e/harness.mjs'
              - '.github/**'

  installer:
    name: Installer build and clean-machine test
    needs: [check, rust, e2e, changes]
    # Runs on main and when started by hand; on pull requests only when `changes` says so.
    if: >-
      always() && needs.check.result == 'success' && needs.rust.result == 'success' && needs.e2e.result == 'success' &&
      (github.event_name != 'pull_request' || needs.changes.outputs.installer == 'true')
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: rust-release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: npm ci

      - name: Build installer
        run: npm run tauri -w app -- build

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: StrataField-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Install, start, upgrade and uninstall on the clean runner; sizes, start-up time and memory go to the summary.
      - name: Clean-machine installer test
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          ./.github/scripts/installer-test.ps1 -Installer $installer.FullName

  # Installs the current version, publishes a pretend newer one on a local web server, and checks the
  # app finds it, installs it and restarts with its data. Uses a throwaway signing key, never the
  # real one. Runs on main, by hand, and on pull requests that touch updating or packaging.
  update:
    name: Automatic update test
    needs: [changes]
    if: >-
      always() && (github.event_name != 'pull_request' || needs.changes.outputs.update == 'true')
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: rust-e2e
          save-if: false

      - run: npm ci

      - name: Throwaway signing key and test update settings
        working-directory: app
        run: |
          $dir = $env:RUNNER_TEMP
          npx tauri signer generate --ci -w "$dir/update-test.key" -p update-test
          $pub = (Get-Content "$dir/update-test.key.pub" -Raw).Trim()
          $conf = @{
            bundle  = @{ createUpdaterArtifacts = $true }
            plugins = @{ updater = @{
              pubkey = $pub
              endpoints = @('http://127.0.0.1:8765/latest.json')
              dangerousInsecureTransportProtocol = $true
              windows = @{ installMode = 'passive' }
            } }
          }
          $conf | ConvertTo-Json -Depth 6 | Set-Content "$dir/update-old.conf.json" -Encoding utf8NoBOM
          $conf.version = '99.0.0'
          $conf | ConvertTo-Json -Depth 6 | Set-Content "$dir/update-new.conf.json" -Encoding utf8NoBOM
          "TAURI_SIGNING_PRIVATE_KEY=$((Get-Content "$dir/update-test.key" -Raw).Trim())" | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=update-test" | Out-File -Append $env:GITHUB_ENV -Encoding utf8

      # Development builds, so the test can reach the window (see open_main_window in lib.rs).
      - name: Build the current version
        run: |
          npm run tauri -w app -- build --debug --config "$env:RUNNER_TEMP/update-old.conf.json"
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/old" | Out-Null
          Copy-Item (Get-ChildItem target/debug/bundle/nsis/*-setup.exe | Select-Object -First 1).FullName "$env:RUNNER_TEMP/old/setup.exe"
          Remove-Item target/debug/bundle/nsis/* -Force

      - name: Build a pretend newer version (99.0.0)
        run: |
          npm run tauri -w app -- build --debug --config "$env:RUNNER_TEMP/update-new.conf.json"
          $new = Get-ChildItem target/debug/bundle/nsis/*-setup.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/new" | Out-Null
          Copy-Item $new.FullName "$env:RUNNER_TEMP/new/setup.exe"
          Copy-Item "$($new.FullName).sig" "$env:RUNNER_TEMP/new/setup.exe.sig"

      - name: Automatic update test
        env:
          UPDATE_OLD_INSTALLER: ${{ runner.temp }}/old/setup.exe
          UPDATE_NEW_INSTALLER: ${{ runner.temp }}/new/setup.exe
          UPDATE_NEW_VERSION: '99.0.0'
        run: node e2e/update-test.mjs
