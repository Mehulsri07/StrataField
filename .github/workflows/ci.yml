name: CI

on:
  push:
    branches: [main, tauri-rebuild]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  windows:
    name: Windows build and smoke test
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - run: npm ci

      # tauri::generate_context! needs the built frontend, even for clippy and tests.
      - name: Build frontend
        run: npm run build -w app

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests (database, migrations, backups, old-data import)
        run: cargo test --workspace

      - name: Build installer
        run: npm run tauri -w app -- build

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: StrataField-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Install silently on the clean runner, launch the app, and make sure it stays open.
      - name: Smoke test installer
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          Start-Process $installer.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA\StrataField" -Recurse -Filter 'stratafield.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw 'Installed StrataField.exe not found' }
          Write-Host "Installed to $($exe.FullName)"
          $app = Start-Process $exe.FullName -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { throw "StrataField exited early with code $($app.ExitCode)" }
          Write-Host 'StrataField is running after 15 seconds'
          # Start-up opens (or creates) the shared database; slow runners can take a while.
          $db = Join-Path $env:APPDATA 'Strata\strata.db'
          $deadline = (Get-Date).AddSeconds(60)
          while (-not (Test-Path $db) -and (Get-Date) -lt $deadline -and -not $app.HasExited) { Start-Sleep -Seconds 2 }
          if (-not (Test-Path $db)) {
            Write-Host "Contents of $env:APPDATA :"; Get-ChildItem $env:APPDATA | Select-Object Name | Format-Table | Out-String | Write-Host
            throw "The app did not create its database at $db within 60 seconds (app exited: $($app.HasExited))"
          }
          Write-Host "Database created at $db"
          Stop-Process -Id $app.Id -Force
