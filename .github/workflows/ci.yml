name: CI

on:
  push:
    branches: [main, tauri-rebuild]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  windows:
    name: Windows build and smoke test
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - run: npm ci

      # tauri::generate_context! needs the built frontend, even for clippy and tests.
      - name: Build frontend
        run: npm run build -w app

      - name: Rust format
        run: cargo fmt --all --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests (database, migrations, backups, old-data import)
        run: cargo test --workspace

      - name: Build installer
        run: npm run tauri -w app -- build

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: StrataField-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Install, start, upgrade and uninstall on the clean runner; sizes, start-up time and memory go to the summary.
      - name: Clean-machine installer test
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          ./.github/scripts/installer-test.ps1 -Installer $installer.FullName
