name: Release

# Pushing a version tag (for example v1.0.0) builds the installer, runs the clean-machine test,
# and attaches the installer to a draft GitHub release. Publishing the draft is left to the owner.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  installer:
    name: Build and test the Windows installer
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - run: npm ci

      - name: Check the tag matches the app version
        run: |
          $version = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne '${{ github.ref_name }}') { throw "Tag ${{ github.ref_name }} does not match the app version $version in tauri.conf.json" }

      - name: Build installer
        run: npm run tauri -w app -- build

      - name: Clean-machine installer test
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          ./.github/scripts/installer-test.ps1 -Installer $installer.FullName

      - name: Draft release with the installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          gh release create '${{ github.ref_name }}' $installer.FullName --draft --title 'StrataField ${{ github.ref_name }}' --notes 'Download the installer below and run it. Windows may show a SmartScreen warning because the installer is not signed yet: choose More info, then Run anyway.'
