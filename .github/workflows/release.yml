name: Release

# Pushing a version tag (for example v1.0.1) builds the installer, runs the clean-machine test, and
# attaches the installer and the update files to a draft GitHub release. Publishing the draft is left
# to the owner; installed copies are offered the update only once it is published.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  installer:
    name: Build and test the Windows installer
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - run: npm ci

      - name: Check the tag matches the app version
        run: |
          $version = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne '${{ github.ref_name }}') { throw "Tag ${{ github.ref_name }} does not match the app version $version in tauri.conf.json" }

      - name: Check the update-signing key and its password are set up
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:KEY) { throw 'The repository secret TAURI_SIGNING_PRIVATE_KEY is missing, so updates cannot be signed. See README, "Automatic updates".' }
          if (-not $env:PASSWORD) { throw 'The repository secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD is missing, so updates cannot be signed. See README, "Automatic updates".' }
          # Every file the release needs must be in the repository.
          foreach ($f in 'CHANGELOG.md', '.github/release-notes.md', 'app/src-tauri/tauri.release.conf.json') {
            if (-not (Test-Path $f)) { throw "$f is missing from the repository." }
          }

      # Also makes the files the in-app updater uses: the installer's signature (.sig).
      - name: Build installer (signed for updates)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -w app -- build --config src-tauri/tauri.release.conf.json

      - name: Clean-machine installer test
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          ./.github/scripts/installer-test.ps1 -Installer $installer.FullName

      # The release notes: what's new (this version's section of CHANGELOG.md), then how to install.
      - name: Release notes
        run: |
          $version = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $lines = Get-Content CHANGELOG.md
          $start = [array]::IndexOf($lines, ($lines | Where-Object { $_ -like "## ``[$version``]*" } | Select-Object -First 1))
          if ($start -lt 0) { throw "CHANGELOG.md has no section for $version. Add one before releasing." }
          $end = $start + 1
          while ($end -lt $lines.Count -and $lines[$end] -notlike '## `[*') { $end++ }
          $whatsNew = ($lines[($start + 1)..($end - 1)] -join "`n").Trim()
          $notes = "## What's new in $version`n`n$whatsNew`n`n" + (Get-Content .github/release-notes.md -Raw)
          # Links in CHANGELOG.md are relative to the repository; make them work on the release page.
          $notes = $notes -replace '\]\((?!https?://)([^)]+)\)', '](https://github.com/${{ github.repository }}/blob/main/$1)'
          $notes | Set-Content release-notes-final.md -Encoding utf8NoBOM
          Get-Content release-notes-final.md

      # latest.json tells installed copies which version is newest and where its signed installer is.
      # They read it from the newest *published* release, so nothing updates until the draft is published.
      - name: Update information for installed copies
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $version = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $info = [ordered]@{
            version  = $version
            notes    = "StrataField $version is available. See what's new on the release page."
            pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = (Get-Content "$($installer.FullName).sig" -Raw).Trim()
                url       = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$($installer.Name)"
              }
            }
          }
          $info | ConvertTo-Json -Depth 5 | Set-Content latest.json -Encoding utf8NoBOM
          Get-Content latest.json

      - name: Draft release with the installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          gh release create '${{ github.ref_name }}' $installer.FullName "$($installer.FullName).sig" latest.json --draft --title 'StrataField ${{ github.ref_name }}' --notes-file release-notes-final.md
