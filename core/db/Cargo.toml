[package]
name = "strata_db"
version = "0.1.0"
description = "Shared StrataField database: schema, migrations, repositories, backups and legacy import"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
